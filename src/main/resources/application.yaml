spring:
  application:
    name: alert-services

  cloud:
    openfeign:
      okhttp:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 5000

  # Configuración PostgreSQL (Supabase/TiDB) — esquema alerts_db
  datasource:
    url: jdbc:postgresql://${TIDB_HOST}:${TIDB_PORT:6543}/${TIDB_DB}?currentSchema=alerts_db&sslmode=require&prepareThreshold=0
    username: ${TIDB_USER}
    password: ${TIDB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

server:
  port: ${PORT:8080}

# Eureka: registro de direcciones para el API Gateway
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    # Vital en Cloud Run para que Eureka no use IPs internas que cambian
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always

# FeignClient: tiempos de espera para comunicación con otros microservicios
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000

# Secret JWT — el API Gateway firma con esta misma clave
app:
  jwt:
    secret: ${JWT_SECRET}

# Swagger / OpenAPI
# Los paths llevan el prefijo /alerts para que coincidan con lo que el Gateway
# enruta hacia este servicio (/alerts/**). Sin el prefijo, el Gateway reenvía
# /alerts/swagger-ui/... pero springdoc lo tenía mapeado en /swagger-ui/... → 404.
springdoc:
  api-docs:
    path: /alerts/v3/api-docs
  swagger-ui:
    path: /alerts/swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
